name: Daily CNBC Intelligence Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  run-dcid:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/dcid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Generate digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DCID_OPENAI_MODEL: gpt-4o-mini
        run: dcid run --category all
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dcid-report
          path: |
            skills/dcid/reports/*.md
            skills/dcid/data/raw/*.jsonl

